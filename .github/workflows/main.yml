### 如何一秒确认 GitHub 给出的具体报错？
如果复制保存该文件到 `.github/workflows/main.yml` 后，GitHub Actions 依然不显示[cite: 2]：
1. 打开你的 GitHub 仓库，点击顶部的 **Actions** 标签页。
2. 查看左侧侧边栏或页面中间，如果语法有误，GitHub 会用红色文字明确提示：`There is an error in the workflow file...`。
3. 如果依然没有任何显示，请核对你当前提交的分支是否为 **Default Branch（主分支）**。
