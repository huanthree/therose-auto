name: Auto Renew therose

on:
  workflow_dispatch:
  schedule:
    - cron: "*/55 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  Renew-therose:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y xvfb
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: Setup Proxy
        continue-on-error: true
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh) || true

      - name: Run Auto Script
        env:
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          IS_PROXY: ${{ env.IS_PROXY }}
          PROXY_SERVER: ${{ env.PROXY_SERVER }}
          TZ: Asia/Shanghai
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 therose.py

      - name: Upload Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-screenshots
          path: "*.png"
          if-no-files-found: ignore
```[cite: 2]

